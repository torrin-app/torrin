x-s3: &s3
  S3_ENDPOINT: "${S3_ENDPOINT:-http://garage:3900}"
  S3_ACCESS_KEY: "${S3_ACCESS_KEY:-GKdeadbeefdeadbeefdeadbeef}"
  S3_SECRET_KEY: "${S3_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}"
  S3_BUCKET: "${S3_BUCKET:-torrin}"
  SIGNING_KEY: "${SIGNING_KEY:-dev-signing-key}"
  CREDS_KEY: "${CREDS_KEY:-}"
  STORAGE_KEY: "${STORAGE_KEY:-}"

x-db: &db "postgres://torrin:torrin@postgres:5432/torrin?sslmode=disable"
x-nats: &nats "nats://nats:4222"
x-public-url: &public-url "${PUBLIC_URL:-http://localhost:8084}"
x-qbit: &qbit-url "${QBIT_URL:-http://qbittorrent:8080}"

x-restart: &restart unless-stopped
x-needs-db: &needs-db
  postgres: { condition: service_healthy }
  nats: { condition: service_started }
x-needs-pg: &needs-pg
  postgres: { condition: service_healthy }

services:
  postgres:
    image: postgres:17
    command: ["-c", "max_connections=200"]
    environment: { POSTGRES_USER: torrin, POSTGRES_PASSWORD: torrin, POSTGRES_DB: torrin }
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: *restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torrin"]
      interval: 3s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2
    command: ["-js"]
    ports: ["127.0.0.1:4222:4222"]
    restart: *restart

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      PUID: "0"
      PGID: "0"
      WEBUI_PORT: "8080"
      QBIT_WEBUI_WHITELIST: "${QBIT_WEBUI_WHITELIST:-172.16.0.0/12}"
      QBIT_TORRENT_PORT: "${QBIT_TORRENT_PORT:-6881}"
    volumes:
      - qbit_config:/config
      - /mnt/cache/qbit:/downloads
      - ./qbit-init.sh:/custom-cont-init.d/10-torrin-qbit.sh:ro
    ports: ["127.0.0.1:8088:8080"]
    restart: *restart

  garage:
    image: rclone/rclone
    user: "0:0"
    command:
      - serve
      - s3
      - /data
      - --addr
      - :3900
      - --auth-key
      - "${S3_ACCESS_KEY},${S3_SECRET_KEY}"
      - --etag-hash
      - none
      - --dir-cache-time
      - 1s
    volumes:
      - /mnt/cache/store:/data/torrin
    ports: ["127.0.0.1:3900:3900"]
    restart: *restart

  api:
    image: "${GHCR_REPO:-ghcr.io/torrin-app/torrin}/api:${TORRIN_TAG:-latest}"
    user: "0:0"
    volumes:
      - /mnt/cache/store:/mnt/cache/store
    environment:
      <<: *s3
      PORT: "8080"
      DATABASE_URL: *db
      NATS_URL: *nats
      PUBLIC_URL: *public-url
      NODE_STREAM_BASES: "${NODE_STREAM_BASES:-}"
      TORRIN_STREAM_RELAYS: "${TORRIN_STREAM_RELAYS:-}"
      BUDGET_MAX_BYTES: "${BUDGET_MAX_BYTES:-1000000000000}"
      EVICTION_CAP_BYTES: "${EVICTION_CAP_BYTES:-300000000000}"
      NODE2_ID: "${NODE2_ID:-}"
      CLUSTER_NODES: "${CLUSTER_NODES:-}"
      EVICTION_HOUR: "${EVICTION_HOUR:-4}"
      PREWARM_MAX_ACTIVE: "${PREWARM_MAX_ACTIVE:-3}"
      PREWARM_MAX_BYTES_GB: "${PREWARM_MAX_BYTES_GB:-25}"
      PREWARM_CACHE_CAP_GB: "${PREWARM_CACHE_CAP_GB:-150}"
      GUMROAD_SECRET: "${GUMROAD_SECRET:-}"
      GUMROAD_SELLER_ID: "${GUMROAD_SELLER_ID:-}"
      RATE_LIMIT_RPS: "${RATE_LIMIT_RPS:-30}"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-60}"
      TORRIN_SEARCH_KEY: "${TORRIN_SEARCH_KEY:-}"
      QBIT_URL: *qbit-url
      QBIT_USER: "${QBIT_USER:-admin}"
      QBIT_PASS: "${QBIT_PASS:-adminadmin}"
      RD_API_KEY: "${RD_API_KEY:-}"
      AD_API_KEY: "${AD_API_KEY:-}"
      TORRENTCLAW_API_KEY: "${TORRENTCLAW_API_KEY:-}"
      USENET_INDEXER_URL: "${USENET_INDEXER_URL:-}"
      USENET_INDEXER_KEY: "${USENET_INDEXER_KEY:-}"
      TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME:-}"
      EMAIL_API_KEY: "${EMAIL_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-torrin <hi@torrin.app>}"
      RESELLER_KEY: "${RESELLER_KEY:-}"
      RCLONE_RC_URL: "${RCLONE_RC_URL:-http://rclone:5572}"
      API_PUBLIC_URL: "${API_PUBLIC_URL:-}"
      WEB_URL: "${WEB_URL:-}"
      BITCART_API_URL: "${BITCART_API_URL:-}"
      BITCART_CHECKOUT_URL: "${BITCART_CHECKOUT_URL:-}"
      BITCART_STORE_ID: "${BITCART_STORE_ID:-}"
      BACHS_API_URL: "${BACHS_API_URL:-}"
      BACHS_SECRET_KEY: "${BACHS_SECRET_KEY:-}"
      BACHS_WEBHOOK_SECRET: "${BACHS_WEBHOOK_SECRET:-}"
      BACHS_PRODUCT_ID: "${BACHS_PRODUCT_ID:-}"
      DONATION_DISCORD_WEBHOOK: "${DONATION_DISCORD_WEBHOOK:-}"
      ADMIN_KEY: "${ADMIN_KEY:-}"
      DAY_PLANS_ENABLED: "${DAY_PLANS_ENABLED:-true}"
      DROPBOX_CLIENT_ID: "${DROPBOX_CLIENT_ID:-}"
      DROPBOX_CLIENT_SECRET: "${DROPBOX_CLIENT_SECRET:-}"
      ONEDRIVE_CLIENT_ID: "${ONEDRIVE_CLIENT_ID:-}"
      ONEDRIVE_CLIENT_SECRET: "${ONEDRIVE_CLIENT_SECRET:-}"
      GDRIVE_CLIENT_ID: "${GDRIVE_CLIENT_ID:-}"
      GDRIVE_CLIENT_SECRET: "${GDRIVE_CLIENT_SECRET:-}"
      PCLOUD_CLIENT_ID: "${PCLOUD_CLIENT_ID:-}"
      PCLOUD_CLIENT_SECRET: "${PCLOUD_CLIENT_SECRET:-}"
    ports: ["8080:8080"]
    depends_on: *needs-db
    restart: *restart

  scheduler:
    image: "${GHCR_REPO:-ghcr.io/torrin-app/torrin}/scheduler:${TORRIN_TAG:-latest}"
    environment: { PORT: "8081" }
    depends_on: *needs-db
    restart: *restart

  catalog:
    image: "${GHCR_REPO:-ghcr.io/torrin-app/torrin}/catalog:${TORRIN_TAG:-latest}"
    environment: { PORT: "8082" }
    depends_on: *needs-db
    restart: *restart

  ingest:
    image: "${GHCR_REPO:-ghcr.io/torrin-app/torrin}/ingest:${TORRIN_TAG:-latest}"
    user: "0:0"
    dns_opt: ["single-request-reopen"]
    environment:
      <<: *s3
      PORT: "8083"
      DATABASE_URL: *db
      NATS_URL: *nats
      NODE_ID: "${NODE_ID:-}"
      CACHE_RC_URLS: "${CACHE_RC_URLS:-}"
      SCRATCH_DIR: "/scratch"
      CAIRN_S3_ENDPOINT: "${CAIRN_S3_ENDPOINT:-}"
      CAIRN_S3_ACCESS_KEY: "${CAIRN_S3_ACCESS_KEY:-}"
      CAIRN_S3_SECRET_KEY: "${CAIRN_S3_SECRET_KEY:-}"
      CAIRN_S3_BUCKET: "${CAIRN_S3_BUCKET:-}"
      CAIRN_S3_REGION: "${CAIRN_S3_REGION:-auto}"
      RD_API_KEY: "${RD_API_KEY:-}"
      AD_API_KEY: "${AD_API_KEY:-}"
      QBIT_URL: *qbit-url
      QBIT_USER: "${QBIT_USER:-admin}"
      QBIT_PASS: "${QBIT_PASS:-adminadmin}"
      USENET_HOST: "${USENET_HOST:-}"
      USENET_PORT: "${USENET_PORT:-563}"
      USENET_USER: "${USENET_USER:-}"
      USENET_PASS: "${USENET_PASS:-}"
      USENET_SSL: "${USENET_SSL:-true}"
      USENET_MAXCONNS: "${USENET_MAXCONNS:-20}"
      USENET_INDEXER_URL: "${USENET_INDEXER_URL:-}"
      USENET_INDEXER_KEY: "${USENET_INDEXER_KEY:-}"
      YTDLP_PROXY: "${YTDLP_PROXY:-}"
      HDENCODE_SOLVER_URL: "${HDENCODE_SOLVER_URL:-}"
    volumes:
      - /mnt/cache/ingest-scratch:/scratch
      - /mnt/cache/qbit:/downloads
    depends_on:
      <<: *needs-db
      qbittorrent: { condition: service_started }
    restart: *restart

  cairn:
    image: "${GHCR_REPO:-ghcr.io/torrin-app/torrin}/cairn:${TORRIN_TAG:-latest}"
    user: "0:0"
    dns_opt: ["single-request-reopen"]
    environment:
      <<: *s3
      PORT: "8087"
      DATABASE_URL: *db
      NATS_URL: *nats
      USENET_POST_HOST: "${USENET_POST_HOST:-}"
      USENET_POST_PORT: "${USENET_POST_PORT:-563}"
      USENET_POST_USER: "${USENET_POST_USER:-}"
      USENET_POST_PASS: "${USENET_POST_PASS:-}"
      USENET_POST_GROUP: "${USENET_POST_GROUP:-alt.binaries.boneless}"
      USENET_POST_FROM: "${USENET_POST_FROM:-}"
      CAIRN_S3_ENDPOINT: "${CAIRN_S3_ENDPOINT:-}"
      CAIRN_S3_ACCESS_KEY: "${CAIRN_S3_ACCESS_KEY:-}"
      CAIRN_S3_SECRET_KEY: "${CAIRN_S3_SECRET_KEY:-}"
      CAIRN_S3_BUCKET: "${CAIRN_S3_BUCKET:-}"
      CAIRN_S3_REGION: "${CAIRN_S3_REGION:-auto}"
    depends_on: *needs-db
    restart: *restart

  stream:
    image: "${GHCR_REPO:-ghcr.io/torrin-app/torrin}/stream:${TORRIN_TAG:-latest}"
    environment:
      <<: *s3
      PORT: "8084"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      API_URL: "${API_URL:-http://api:8080}"
      DATABASE_URL: *db
      RCLONE_RC_URL: "${RCLONE_RC_URL:-http://rclone:5572}"
    restart: *restart
    ports: ["8084:8084"]

  stremio:
    image: "${GHCR_REPO:-ghcr.io/torrin-app/torrin}/stremio:${TORRIN_TAG:-latest}"
    environment: { <<: *s3, PORT: "7000", TORRIN_STREAM_RELAYS: "${TORRIN_STREAM_RELAYS:-}", DATABASE_URL: *db, PUBLIC_URL: *public-url }
    ports: ["7000:7000"]
    depends_on: *needs-pg
    restart: *restart

  webdav:
    image: "${GHCR_REPO:-ghcr.io/torrin-app/torrin}/webdav:${TORRIN_TAG:-latest}"
    environment: { <<: *s3, PORT: "9092", DATABASE_URL: *db, PUBLIC_URL: *public-url }
    ports: ["9092:9092"]
    depends_on: *needs-pg
    restart: *restart

  rclone:
    image: "${GHCR_REPO:-ghcr.io/torrin-app/torrin}/rclone:${TORRIN_TAG:-latest}"
    dns_opt: ["single-request-reopen"]
    ports: ["127.0.0.1:5572:5572"]
    volumes: [rclone_config:/data]
    restart: *restart

  byos-rc-tunnel:
    image: alpine/socat
    restart: unless-stopped
    depends_on: [rclone]
    ports: ["10.9.0.2:5572:5572"]
    command: TCP-LISTEN:5572,fork,reuseaddr TCP:rclone:5572

  byos:
    image: "${GHCR_REPO:-ghcr.io/torrin-app/torrin}/byos:${TORRIN_TAG:-latest}"
    user: "0:0"
    environment:
      <<: *s3
      PORT: "8085"
      DATABASE_URL: *db
      NATS_URL: *nats
      RCLONE_RC_URL: "${RCLONE_RC_URL:-http://rclone:5572}"
    depends_on:
      <<: *needs-db
      rclone: { condition: service_started }
    restart: *restart

  telegram:
    image: "${GHCR_REPO:-ghcr.io/torrin-app/torrin}/telegram:${TORRIN_TAG:-latest}"
    user: "0:0"
    environment:
      <<: *s3
      PORT: "8086"
      DATABASE_URL: *db
      NATS_URL: *nats
      PUBLIC_URL: *public-url
      SCRATCH_DIR: "/scratch"
      TELEGRAM_TMP_PATH: "/scratch/telegram"
      TELEGRAM_API_ID: "${TELEGRAM_API_ID:-}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME:-}"
    volumes:
      - /mnt/cache/telegram-scratch:/scratch
    depends_on: *needs-db
    restart: *restart

volumes:
  pgdata:
  qbit_config:
  rclone_config:
